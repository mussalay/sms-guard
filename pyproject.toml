[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Notebook bootstrap locates the project before importing its modules.
"notebooks/*.ipynb" = ["E402"]
