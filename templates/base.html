<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token|default('') }}">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link href="{{ url_for('static', path='/vendor/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', path='/css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark" aria-label="Основная навигация">
    <div class="container d-flex flex-wrap gap-3">
      <a class="navbar-brand" href="/">{{ app_name }}</a>
      <div class="d-flex flex-wrap gap-3">
        {% if user %}
        <a class="text-white" href="/">Dashboard</a>
        <a class="text-white" href="/check/sms/">SMS</a>
        <a class="text-white" href="/check/url/">URL</a>
        <a class="text-white" href="/history/">История</a>
        <a class="text-white" href="/profile/">Профиль</a>
        <button class="btn btn-sm btn-outline-light" id="logout">Выйти</button>
        {% else %}
        <a class="text-white" href="/login/">Войти</a>
        <a class="text-white" href="/register/">Регистрация</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-5" id="main">{% block content %}{% endblock %}</main>
  <footer class="container pb-4 text-secondary">Оценка носит вероятностный характер и не гарантирует безопасность.</footer>
  <script src="{{ url_for('static', path='/vendor/chart.umd.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>
</html>
